# It may seem obvious but.. what is text?

- From a sociolinguistic perspective: any symbolically encoded language.&lt;br&gt;These come in many types:
  - Alphabetic – symbols (letters) to represent vowels and consonants (e.g., Latin)
  - Abjads – symbols to represent consonants, with diacritics (or reused consonants) to represent vowels (e.g., Arabic, Hebrew)
  - Syllabic – Symbol systems representing consonants plus inherent vowels (e.g., Devanagari)
  - Semanto-phonetic – Symbols that carry meaning and/or sounds (e.g., Chinese)
- Plus, there are additional writing systems: Braille, shorthand, phonetic alphabets

---

# What is Text?

- From a computer perspective a binary encoding system for storing written language symbols from the world’s various systems

&lt;div style="display:flex; gap:32px; align-items:flex-start; justify-content:center;"&gt;
  &lt;img src="assets/media/slide3_2.png" alt="left" style="max-width:20%; height:auto;"&gt;
  &lt;img src="assets/media/slide3_1.png" alt="right" style="max-width:48%; height:auto;"&gt;
&lt;/div&gt;

- From ASCII (7-bits) to Unicode: An international standard that supports up to four bytes (32 bits) per symbol and that encodes 137,439 characters from 146 different scripts.

# “Unstructured” is the Key

- Natural language is notoriously flexible and ambiguous
- – even simple tasks like parsing are complicated:
- Contractions; Compound words; Misspellings; Proper Names; Preposition Attachment; Vernacular
- Transforming a set of documents into data that allow for comparisons, linkages, visualization, or other analysis, is complex and contains many decisions

# Statistical Approaches

&lt;img src="assets/media/slide8_1.png" style="width:70%; height:auto; border-radius:6px;"&gt;

- Treat each text fragment as a collection of units/words, without regard to word order
- Use many text fragments – e.g. chapters from a book; each fragment is considered a “document”
- Compute a term-document matrix (TDM) (or document term matrix); a sparse matrix pinning down the count of appearance of a term (aka word) in a document
- Conduct statistical or machine learning analysis on the
- TDM to reveal patterns

# Natural Language Processing

- Tokenizes and tags text to detect and preserve part-of-speech
- Post processing of tokens tries to resolve syntactic dependencies, co-references, names of entities, sequences of events, etc.
- Machine learning can then be used to solve a variety of difficult challenges such question answering, information retrieval, and machine translation, e.g., ChatGPT, Alexa, Siri…

- Organizations: Examine the dynamics of team formation by analyzing listserv emails

- Sociology: Track levels of hate speech over time using text from online forums

# How to start analyzing text data?

- Read in a text file, separating into paragraphs, each of which will be treated as a separate “document”
- Tokenize the text into a bag of words, representing it as a Document-Term Matrix
- Extract term frequency information
- Visualize term frequency information
- Match term frequency to dictionaries of positive and negative connoted words (merge)
- Visualize results
- **Research question:** In a nomination acceptance speech, do positive sentiments predominate over negative ones?

# Load Libraries + Dictionaries

- We need tools for tables, plots, tokenization, stopwords, and word counts.
- We also load the speech and the two sentiment dictionaries.


```python
import pandas as pd # for tables and data frames
import matplotlib.pyplot as plt # for visualizations
from nltk.tokenize import word_tokenize # to split text into tokens
from nltk.corpus import stopwords # to remove common filler words
from collections import Counter # to count word frequencies

# Read the data in
with open('speech.txt') as f:
    text = f.read().lower()

# Read the dictionaries
with open('positive-words.txt', encoding='latin-1') as f:
    poswords = f.readlines()

with open('negative-words.txt', encoding='latin-1') as f:
    negwords = f.readlines()
```

---

# Tokenize the Speech

- `word_tokenize()` turns the speech into a list of tokens.
- A token can be a word, number, or punctuation mark.


```python
tokens = word_tokenize(text)
```

# A Quick Python Refresher

- A reminder of how a `for` loop builds a list:
- We use the same idea in the next slide when creating our cleaned token list.


```python
mylist = []
for i in range(1,4):
    mylist.append(i)
mylist
```

```
## [1, 2, 3]
```

---

# Remove Stopwords + Punctuation

- We remove common words like "the" and "and".
- We also keep only alphabetic tokens with `isalpha()`.
- This leaves us with a cleaner set of content words.


```python
# get rid of stopwords like a, an, the ... and punctuation: ! , .
stop_words = set(stopwords.words('english'))

clean_token = []
for w in tokens:
    if w.isalpha() and w not in stop_words:
        clean_token.append(w)
```

---

# Most Frequent Clean Words

- `Counter(clean_token)` counts how many times each word appears.
- Then we convert those counts into a data frame and sort from high to low.


```python
freq = Counter(clean_token) # count each remaining word
df = pd.DataFrame(freq.items(),columns=['word','count'])\
                            .sort_values('count',ascending=False)\
                            .reset_index(drop=True)
top_words = df.head(10)
top_words
```

# Lemmatization: Group Word Variants

- Lemmatization helps matching related forms to one base word.
- So `families` becomes `family`, and `children` becomes `child`.


```python
from nltk.stem import WordNetLemmatizer # for auto-lemmatization

lemmatizer = WordNetLemmatizer() # initialize lemmatizer
lemmatizer.lemmatize('families') # test
```

```
## 'family'
```

```python
lemmatizer.lemmatize('children') # another test
```

```
## 'child'
```

---

# Rebuild the Frequency Table with Lemmas



```python
lemmas = []
for w in clean_token:
    word = lemmatizer.lemmatize(w) # this is where lemmatizer runs
    lemmas.append(word) # append back

freq = Counter(lemmas) # get counts

df = pd.DataFrame(freq.items(),columns=['word','count'])\
                            .sort_values('count',ascending=False)\
                            .reset_index(drop=True)
```

# Prepare the Sentiment Dictionaries

- Now we clean the positive and negative dictionaries so they can be matched against our speech words.
- We strip away newline characters and turn each dictionary into a data frame.


```python
# let's look positive and negative in Al Gore's speech

# stripping away the '\n' newline characters
pos_list=[]
for w in poswords:
    pos_list.append(w.strip())

neg_list=[]
for w in negwords:
    neg_list.append(w.strip())

# convert the dictionaries to pandas df
pos_df = pd.DataFrame(pos_list,columns=['word'])
pos_df['sentiment'] = 'positive'

neg_df = pd.DataFrame(neg_list,columns=['word'])
neg_df['sentiment'] = 'negative'
```

# Merge Words with Positive and Negative Lexicons

- A merge keeps only the overlapping words.
- So here, we isolate the positive and negative words that actually appear in the speech.


```python
out_pos = pd.merge(df, pos_df, on=['word'])
out_neg = pd.merge(df, neg_df, on=['word'])

top_pos = out_pos.head(10)
top_neg = out_neg.head(10)
```

# Relative Frequency of Sentiment

- Raw counts are useful, but proportions are even more helpful.
- Here we divide by the total number of cleaned words to compare positive and negative language on the same scale.


```python
# freq of positive words: num of positive words / number of total words
pos_freq = out_pos['count'].sum() / df['count'].sum()
neg_freq = out_neg['count'].sum() / df['count'].sum()

print(pos_freq)
```

```
## 0.08754338603933667
```

```python
print(neg_freq)

# on average, Al Gore used two times more positive words in 
# relative to neg words on this speech
```

# Recap

- We read a speech into Python and tokenized it into analyzable pieces.
- We removed stopwords and punctuation, then lemmatized terms to combine close word variants.
- We matched the cleaned vocabulary against positive and negative dictionaries.
- The speech uses noticeably more positive than negative language.
- The final word cloud gives a quick visual summary of the most prominent themes.
- You can imagine running a similar analysis on other speeches, news articles, books, reddit posts...
